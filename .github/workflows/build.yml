name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_linux_test_binary:
        description: Build and upload a Linux debug test binary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs -> target

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run tests
        run: just test -p codex-cli

  build-linux-test-binary:
    name: Build linux test binary
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux_test_binary
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs -> target
          key: linux-test-binary

      - name: Resolve Codex npm version
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view @openai/codex version --registry=https://registry.npmjs.org/)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Using @openai/codex@${version}"

      - name: Sync Rust version from npm
        shell: bash
        env:
          CODEX_NPM_VERSION: ${{ steps.npm-version.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          const version = process.env.CODEX_NPM_VERSION;
          const path = "Cargo.toml";
          const text = fs.readFileSync(path, "utf8");
          const next = text.replace(
            /(\[workspace\.package\]\s*\n)version = "[^"]+"/,
            `$1version = "${version}"`,
          );
          if (next === text) {
            throw new Error("failed to update workspace package version");
          }
          fs.writeFileSync(path, next);
          NODE
          grep '^version = ' Cargo.toml

      - name: Build binary
        run: cargo build -p codex-cli

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-linux-test
          path: codex-rs/target/debug/codex
          if-no-files-found: error
